<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="author" content="Khant Min Myat">
    <link rel="stylesheet" href="./styles/form.css">
    <script src="./scripts/form.js" defer></script>
</head>
<body>
<header>
    <h1>Product Review</h1>
</header>

    <main>
        <form method="get" action="review.html">
        <div class="form-group">
            <label for="productName">Product Name <span class="required">*</span></label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>
        </div>

        <fieldset class="form-group">
            <legend>Overall Rating <span class="required">*</span></legend>
            <div class="rating">
                <label><input type="radio" id="star1" name="rating" value="1" required> ☆</label>
                <label><input type="radio" id="star2" name="rating" value="2"> ☆☆</label>
                <label><input type="radio" id="star3" name="rating" value="3"> ☆☆☆</label>
                <label><input type="radio" id="star4" name="rating" value="4"> ☆☆☆☆</label>
                <label><input type="radio" id="star5" name="rating" value="5"> ☆☆☆☆☆</label>
            </div>
            </fieldset>

        <div class="form-group">
            <label for="installDate">Date of Installation <span class="required">*</span></label>
            <input type="date" id="installDate" name="installDate" required>
        </div>

        <fieldset class="form-group">
            <legend>Which features did you find useful in the product? (Check all that apply)</legend>
            <label><input type="checkbox" id="feature-durability" name="features" value="durability"> Durability</label>
            <label><input type="checkbox" id="feature-ease" name="features" value="easeOfUse"> Ease of Use</label>
            <label><input type="checkbox" id="feature-performance" name="features" value="performance"> Performance</label>
            <label><input type="checkbox" id="feature-design" name="features" value="design"> Design</label>
        </fieldset>

        <div class="form-group">
            <label for="review">Written Review <span class="optional">(Optional)</span></label>
            <textarea id="review" name="review" rows="5"></textarea>
        </div>

        <div class="form-group">
            <label for="userName">Your Name <span class="optional">(Optional)</span></label>
            <input type="text" id="userName" name="userName">
        </div>

        <input type="submit" value="Post Review" class="submit-btn">
        
        </form>
    </main>
    <footer>
        <p>©️<span id="currentYear"></span>🏙️ Khant Min Myat 🏙️ Myanmar</p>
        <p>
            Last Modification: <span id="lastModified"></span>
        </p>
    </footer>
</body>
</html>
