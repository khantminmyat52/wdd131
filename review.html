<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Confirmation</title>
    <meta name="description" content="This is just page for my review and this pages does not do very much."
    <meta name="author" content="Khant Min Myat">
    <link rel="stylesheet" href="form.css">
    <script>
        document.addEventListener("DOMContentLoaded", () => {
        let count = Number(localStorage.getItem("reviewCount")) || 0;
        count += 1;
        localStorage.setItem("reviewCount", count);
        document.getElementById("reviewCountDisplay").textContent = count;
        });
    </script>
</head>
    <body>
    <main class="confirmation-container">
        <h2>Thank You for Your Review!</h2>
        <p>Your feedback has been successfully submitted.</p>
        <p>Total Reviews Completed: <strong id="reviewCountDisplay">0</strong></p>
        <a href="form.html" class="back-link">Submit Another Review</a>
    </main>
    </body>
    </html>
